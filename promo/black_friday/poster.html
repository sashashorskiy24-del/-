<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --lime:#d4ff2a; --pink:#ff2e8a; --ink:#0a0a0a; --paper:#f4f1ea; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; background:var(--ink); overflow:hidden; }
  .poster { position:relative; width:1080px; height:1350px; overflow:hidden;
    background:
      radial-gradient(circle at 30% 55%, #1d2a06 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #3a0820 0%, transparent 40%),
      var(--ink);
    font-family:'Rubik', sans-serif; color:#fff; }

  /* halftone dots */
  .dots { position:absolute; inset:0; opacity:.55;
    background-image: radial-gradient(var(--lime) 1.6px, transparent 2px);
    background-size: 18px 18px;
    -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 38%);
            mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 38%); }
  .dots2 { position:absolute; inset:0; opacity:.35;
    background-image: radial-gradient(var(--pink) 1.6px, transparent 2px);
    background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(circle at 0% 100%, #000 0%, transparent 35%);
            mask-image: radial-gradient(circle at 0% 100%, #000 0%, transparent 35%); }

  /* caution tapes */
  .tape { position:absolute; left:-100px; width:1400px; height:62px; display:flex; align-items:center;
    white-space:nowrap; font-family:'Unbounded'; font-weight:900; font-size:26px; letter-spacing:1px; }
  .tape span { padding:0 18px; }
  .tape.lime { top:22px; background:var(--lime); color:var(--ink); transform:rotate(-3deg); z-index:3;
    box-shadow:0 8px 0 rgba(0,0,0,.35); }
  .tape.pink { top:1268px; background:var(--pink); color:#fff; transform:rotate(2.5deg); z-index:6; }

  /* price tag */
  .tag { position:absolute; left:90px; top:120px; width:860px; height:330px; transform:rotate(-5deg); z-index:4; }
  .tag svg { position:absolute; inset:0; overflow:visible; }
  .tag .t1, .tag .t2 { position:absolute; left:150px; font-family:'Unbounded'; font-weight:900;
    color:var(--ink); line-height:.86; letter-spacing:-4px; }
  .tag .t1 { top:42px; font-size:128px; }
  .tag .t2 { top:160px; font-size:128px; color:var(--ink); }
  .tag .t2 b { color:var(--ink); -webkit-text-stroke:0; font-weight:900; }
  .tag .fine { position:absolute; right:36px; top:22px; font:800 15px 'Rubik'; color:var(--ink);
    letter-spacing:2px; text-align:right; opacity:.8; }
  .tag .num { position:absolute; left:36px; bottom:24px; writing-mode:vertical-rl; transform:rotate(180deg);
    font:900 15px 'Rubik'; letter-spacing:3px; color:var(--ink); opacity:.75; }

  /* giant 2 */
  .two { position:absolute; left:210px; top:300px; font-family:'Unbounded'; font-weight:900; font-size:860px;
    line-height:1; color:transparent; -webkit-text-stroke:4px rgba(212,255,42,.45); z-index:1; letter-spacing:-30px; }

  .phones { position:absolute; left:-10px; top:470px; width:640px; z-index:2;
    transform:rotate(-2deg);
    -webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 92%); mask-image:linear-gradient(to bottom,#000 62%,transparent 92%); }

  /* right copy */
  .copy { position:absolute; right:56px; top:520px; width:430px; text-align:right; z-index:5; }
  .copy .l1 { font:900 66px/0.95 'Rubik'; text-transform:uppercase; }
  .copy .l1 em { font-style:normal; color:var(--lime); }
  .copy .chip { display:inline-block; margin-top:16px; background:var(--lime); color:var(--ink);
    font:900 84px/1 'Rubik'; padding:10px 22px 14px; transform:rotate(-3deg); border-radius:14px;
    box-shadow:8px 8px 0 var(--pink); }
  .copy .sub { margin-top:26px; font:800 26px 'Rubik'; letter-spacing:6px; color:#fff; opacity:.9; }
  .copy .sub i { font-style:normal; color:var(--lime); }

  /* sticker */
  .sticker { position:absolute; right:40px; top:880px; width:520px; height:380px; z-index:5; transform:rotate(-7deg); }
  .sticker svg { position:absolute; inset:0; overflow:visible; }
  .sticker .big { position:absolute; left:0; right:10px; top:82px; text-align:center;
    font-family:'Rubik'; font-weight:900; font-size:156px; letter-spacing:-5px; color:var(--ink); line-height:1; }
  .sticker .small { position:absolute; left:0; right:0; top:262px; text-align:center;
    font:900 26px 'Rubik'; letter-spacing:4px; color:var(--ink); text-transform:uppercase; }

  /* handwritten */
  .hand { position:absolute; left:58px; top:1065px; z-index:6; transform:rotate(-8deg); }
  .hand .txt { font-family:'Caveat'; font-weight:700; font-size:92px; line-height:.85; color:#fff; }
  .hand svg { position:absolute; overflow:visible; }

  .grain { position:absolute; inset:0; z-index:20; pointer-events:none; mix-blend-mode:overlay; opacity:.35; }
</style>
</head>
<body>
<div class="poster">
  <div class="dots"></div>
  <div class="dots2"></div>

  <div class="tape lime">
    <span>BLACK FRIDAY</span><span>✦</span><span>−30% НА 2-Й ЧОХОЛ</span><span>✦</span>
    <span>BLACK FRIDAY</span><span>✦</span><span>−30% НА 2-Й ЧОХОЛ</span><span>✦</span><span>BLACK FRIDAY</span>
  </div>

  <!-- Price tag -->
  <div class="tag">
    <svg viewBox="0 0 860 330" width="860" height="330">
      <!-- string -->
      <path d="M 70 165 C 20 120, -10 60, 40 -10 S 140 -60, 120 -90" fill="none" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/>
      <!-- tag body -->
      <path d="M 110 0 H 830 Q 860 0 860 30 V 300 Q 860 330 830 330 H 110 L 0 165 Z" fill="#d4ff2a"/>
      <!-- inner dashed border -->
      <path d="M 116 14 H 826 Q 846 14 846 34 V 296 Q 846 316 826 316 H 116 L 18 165 Z" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-dasharray="10 8" opacity=".55"/>
      <!-- eyelet -->
      <circle cx="70" cy="165" r="22" fill="#0a0a0a"/>
      <circle cx="70" cy="165" r="22" fill="none" stroke="#9aa0a6" stroke-width="6"/>
      <!-- barcode -->
      <g fill="#0a0a0a" transform="translate(700 236)">
        <rect x="0" width="4" height="56"/><rect x="8" width="2" height="56"/><rect x="13" width="6" height="56"/>
        <rect x="23" width="2" height="56"/><rect x="28" width="3" height="56"/><rect x="35" width="6" height="56"/>
        <rect x="44" width="2" height="56"/><rect x="49" width="4" height="56"/><rect x="56" width="2" height="56"/>
        <rect x="61" width="6" height="56"/><rect x="70" width="3" height="56"/><rect x="76" width="2" height="56"/>
        <rect x="81" width="5" height="56"/><rect x="89" width="2" height="56"/><rect x="94" width="4" height="56"/>
        <rect x="101" width="2" height="56"/><rect x="106" width="6" height="56"/><rect x="115" width="3" height="56"/>
      </g>
    </svg>
    <div class="t1">BLACK</div>
    <div class="t2">FRIDAY</div>
    <div class="fine">SILICONE CASE<br>SALE · 2026</div>
  </div>

  <div class="two">2</div>
  <img class="phones" src="phones_cut.png" alt="">

  <div class="copy">
    <div class="l1">Знижка<br>на <em>2-й</em></div>
    <div class="chip">ЧОХОЛ</div>
    <div class="sub">SILICONE <i>✦</i> CASE</div>
  </div>

  <!-- Sticker -->
  <div class="sticker">
    <svg viewBox="0 0 520 380" width="520" height="380">
      <defs>
        <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd1e6"/><stop offset="1" stop-color="#c41866"/>
        </linearGradient>
      </defs>
      <!-- shadow -->
      <path d="M 26 40 L 500 18 L 512 310 L 440 372 L 14 360 Z" fill="#000" opacity=".45" transform="translate(10 14)"/>
      <!-- white die-cut border -->
      <path d="M 14 30 L 506 8 L 516 300 L 446 372 L 4 360 Z" fill="#fff"/>
      <!-- pink body -->
      <path d="M 30 44 L 492 24 L 500 292 L 438 354 L 20 344 Z" fill="#ff2e8a"/>
      <!-- peeled corner -->
      <path d="M 446 372 L 516 300 L 470 310 Z" fill="url(#peel)"/>
      <path d="M 438 354 L 500 292" stroke="#000" stroke-opacity=".15" stroke-width="2"/>
    </svg>
    <div class="big">−30%</div>
    <div class="small">на другий чохол</div>
  </div>

  <!-- Handwritten note with arrow -->
  <div class="hand">
    <div class="txt">Вигідна<br>покупка!</div>
    <svg style="left:20px; top:150px" width="300" height="40" viewBox="0 0 300 40">
      <path d="M 4 22 C 70 8, 150 30, 230 12 S 290 18, 296 14" fill="none" stroke="#d4ff2a" stroke-width="7" stroke-linecap="round"/>
      <path d="M 30 34 C 100 22, 180 36, 260 26" fill="none" stroke="#d4ff2a" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    </svg>
    <svg style="left:290px; top:-120px" width="160" height="160" viewBox="0 0 160 160">
      <path d="M 20 150 C 30 90, 70 50, 130 30" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <path d="M 100 18 L 134 28 L 116 58" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="tape pink">
    <span>ТІЛЬКИ ЦЬОГО ТИЖНЯ</span><span>✦</span><span>BLACK FRIDAY</span><span>✦</span>
    <span>ТІЛЬКИ ЦЬОГО ТИЖНЯ</span><span>✦</span><span>BLACK FRIDAY</span><span>✦</span><span>ТІЛЬКИ ЦЬОГО ТИЖНЯ</span>
  </div>

  <svg class="grain" width="1080" height="1350">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>
</body>
</html>
